model:
  base_learning_rate: 1.0e-5
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    # --- 噪声/损失 ---
    timesteps: 1000
    linear_start: 0.0001
    linear_end: 0.02
    beta_schedule: cosine
    loss_type: l2
    parameterization: eps
    num_timesteps_cond: 1
    monitor: val/loss_simple_ema
    use_ema: true

    # --- latent 尺度与通道（匹配 AE：z ∈ R^{4×32×32}）---
    image_size: 64
    channels: 4
    scale_by_std: true

    # --- 打开类条件（ADM风格）---
    conditioning_key: adm
    cond_stage_key: class_label
    cond_stage_config:
      target: ldm.modules.encoders.modules.ClassEmbedder
      params:
        embed_dim: 256                     # ↓ 与 UNet 的 context_dim 一致
        n_classes: 812
        key: class_label

    # --- First-stage：加载你已训好的 KL-AE 并冻结 ---
    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4]   # → latent 64×64（与你的 AE 一致）
          num_res_blocks: 2
          attn_resolutions: [32]
          dropout: 0.0
        lossconfig:
          target: ldm.modules.losses.LPIPSWithDiscriminator
          params:
            disc_start: 40000
            kl_weight: 1.0e-6
            disc_weight: 0.5
        monitor: val/rec_loss
    first_stage_ckpt: /work3/s240046/iris_ldm/logs/2025-10-29T00-15-25_iris_ae_kl_64/checkpoints/epoch=000020.ckpt
    first_stage_key: image

    # --- UNet（在 latent 32×32 上做扩散）---
    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 64
        in_channels: 4
        out_channels: 4
        model_channels: 256
        channel_mult: [1, 2, 3, 4]
        num_res_blocks: 2
        attention_resolutions: [8, 4, 2, 1]
        num_heads: 8
        use_spatial_transformer: true
        transformer_depth: 1
        context_dim: 256
        use_checkpoint: true
        dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 4
    wrap: false
    train:
      target: ldm.data.iris_csv.IrisCSV
      params:
        csv_path: /work3/s240046/iris_ldm/data/iris_manifest.csv
        split: train
    validation:
      target: ldm.data.iris_csv.IrisCSV
      params:
        csv_path: /work3/s240046/iris_ldm/data/iris_manifest.csv
        split: val

# --- 优化器 & 调度 ---
optim:
  target: torch.optim.AdamW
  params:
    lr: 1.0e-4
    betas: [0.9, 0.99]
    eps: 1.0e-8
    weight_decay: 0

lr_scheduler:
  target: ldm.modules.lr_schedules.WarmupCosineLR
  params:
    warmup_steps: 1000
    min_lr: 1.0e-5
    max_steps: 300000

lightning:
  logger:
    target: pytorch_lightning.loggers.TensorBoardLogger
    params:
      save_dir: /work3/s240046/iris_ldm/logs
      name: stageA_sota
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 5000
        max_images: 6
        increase_log_steps: true
    modelckpt:
      target: pytorch_lightning.callbacks.ModelCheckpoint
      params:
        filename: '{epoch:06}'
        save_last: false
        save_top_k: 2
        monitor: val/loss_simple_ema
        mode: min
  trainer:
    accelerator: gpu
    gpus: 1
    precision: 32          # ← 为避开半精度 LayerNorm dtype 问题
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0